<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-gradient-to-br from-black via-gray-900 to-gray-800 flex items-center justify-center">

    <div class="w-full max-w-md p-8 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">Register Now!</h1>
            <p class="text-gray-400 text-sm mt-2">Sign up to continue</p>
        </div>

        <!-- Form -->
        <form id="form" class="space-y-5">

            <!-- User name -->
            <div>
                <label class="text-gray-400 text-sm">Name</label>
                <input type="text" id="name" placeholder="User_name" required
                    class="w-full mt-1 px-4 py-3 rounded-lg bg-black/40 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
            </div>

            <!-- Email -->
            <div>
                <label class="text-gray-400 text-sm">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required
                    class="w-full mt-1 px-4 py-3 rounded-lg bg-black/40 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
            </div>

            <!-- Password -->
            <div>
                <label class="text-gray-400 text-sm">Password</label>
                <input type="password" id="password" placeholder="Create password" required
                    class="w-full mt-1 px-4 py-3 rounded-lg bg-black/40 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
            </div>

            <!-- Button -->
            <button id="button" type="submit"
                class="w-full py-3 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold hover:opacity-90 hover:scale-[1.01] transition">
                Create Account
            </button>

        </form>

        <!-- Footer -->
        <p class="text-center text-gray-400 text-sm mt-6">
            Already have an account?
            <span id="signin" class="text-purple-400 hover:text-purple-300 hover:underline cursor-pointer transition">
                Sign In
            </span>
        </p>

    </div>



    <!--================= Script logic ===================-->
    <script>
        const name = document.getElementById("name")
        const email = document.getElementById("email")
        const password = document.getElementById("password");
        const button = document.getElementById("button")
        const form = document.getElementById("form")
        const signin = document.getElementById("signin");

        form.addEventListener("submit", async (e) => {
            e.preventDefault()

            const body = {
                username : name.value,
                email: email.value,
                password: password.value
            }

            const res = await fetch("http://localhost:7000/api/signup", {
                headers: { "Content-Type": "application/json" },
                method: "POST",
                body: JSON.stringify(body)
            })

            const data = await res.json();

            if (data.success) {
                window.location.href = "/signin";
            }
        });

        signin.addEventListener("click", () => {
            window.location.href = "/signin"
        })
    </script>
</body>

</html>
