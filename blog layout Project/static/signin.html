<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-gradient-to-br from-black via-gray-900 to-gray-800 flex items-center justify-center">

    <div class="w-full max-w-md p-8 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl">

        <!--========== Heading ========= -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">Welcome Back</h1>
            <p class="text-gray-400 text-sm mt-2">Sign in to continue</p>
        </div>

        <!--======== Form ========-->
        <form id="form" class="space-y-5">

            <!--======== Email ========-->
            <div>
                <label class="text-gray-400 text-sm">Email</label>
                <input id="email" type="email" placeholder="you@example.com"
                    class="w-full mt-1 px-4 py-3 rounded-lg bg-black/40 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" />
            </div>

            <!--========= Password =========-->
            <div>
                <label class="text-gray-400 text-sm">Password</label>
                <input id="password" type="password" placeholder="••••••••"
                    class="w-full mt-1 px-4 py-3 rounded-lg bg-black/40 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" />
            </div>

            <!--======== Button =========-->
            <button id="submit"
                class="w-full py-3 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold hover:opacity-90 hover:scale-[1.01] transition transform">
                Sign In
            </button>

        </form>

        <!--======= Footer =========-->
        <p class="text-center text-gray-400 text-sm mt-6">
            Don’t have an account?
            <a href="/signup" class="text-purple-400 hover:text-purple-300 hover:underline transition">
                Sign Up
            </a>
        </p>

    </div>


    <script>
        const email = document.getElementById("email")
        const password = document.getElementById("password");
        const button = document.getElementById("button")
        const form = document.getElementById("form")
        const signup = document.getElementById("signup");

        form.addEventListener("click", async (e) => {

            e.preventDefault();

            const body = {
                email: email.value,
                password: password.value
            }

            const res = await fetch("http://localhost:7000/api/signin", {
                headers: { "Content-Type": "application/json" },
                method: "POST",
                body: JSON.stringify(body)
            })

            const data = await res.json()

            if (data.success) {
                window.location.href = "/";
            }

            // fetch("http://localhost:7000/api/signin" , {
            //     headers : {"Content-Type": "application/json"},
            //     method : "POST",
            //     body : JSON.stringify(body)
            // })
            // .then((res)=>res.json())
            // .then((data)=>console.log(data))
        });

        signup.addEventListener("click", () => {
            window.location.href = "/signup"
        })
    </script>
</body>

</html>
